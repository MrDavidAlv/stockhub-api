services:
  postgres:
    image: postgres:16-alpine
    container_name: stockhub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockhub_db}
      POSTGRES_USER: ${POSTGRES_USER:-stockhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copia .env.example a .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockhub} -d ${POSTGRES_DB:-stockhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: stockhub-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  postgres_data:
