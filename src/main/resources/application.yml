spring:
  application:
    name: stockhub-api
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/stockhub_db}
    username: ${SPRING_DATASOURCE_USERNAME:stockhub}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_TLS:false}

mail:
  from: ${MAIL_FROM:no-reply@stockhub.local}

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 60
  refresh-token-days: 7

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:9000}

seed:
  admin-email: ${SEED_ADMIN_EMAIL:admin@stockhub.local}
  admin-password: ${SEED_ADMIN_PASSWORD}
  externo-email: ${SEED_EXTERNO_EMAIL:externo@stockhub.local}
  externo-password: ${SEED_EXTERNO_PASSWORD}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
