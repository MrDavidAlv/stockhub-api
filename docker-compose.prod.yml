services:
  postgres:
    image: postgres:16-alpine
    container_name: stockhub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [stockhub]

  api:
    image: ghcr.io/mrdavidalv/stockhub-api:latest
    container_name: stockhub-api
    expose: ["8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_EXTERNO_PASSWORD: ${SEED_EXTERNO_PASSWORD}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_AUTH: "true"
      MAIL_TLS: "true"
      MAIL_FROM: ${MAIL_FROM:-no-reply@stockhub.local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [stockhub]

  web:
    image: ghcr.io/mrdavidalv/stockhub-web:latest
    container_name: stockhub-web
    expose: ["80"]
    restart: unless-stopped
    networks: [stockhub]

  nginx:
    image: nginx:alpine
    container_name: stockhub-nginx
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]
    restart: unless-stopped
    networks: [stockhub]

volumes:
  postgres_data:

networks:
  stockhub:
    driver: bridge
